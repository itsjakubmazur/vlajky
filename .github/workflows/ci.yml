name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vygenerovat data a vlajky
        run: npm run data
      - name: Typy
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npx next build
      - name: Testy
        run: npm test
